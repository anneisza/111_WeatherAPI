<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Location Finder</h1>
    </header>

    <main>
        <section class="identitas">
            <p>Nama: Riza Fitria Istiqomah Zaitunah</p>
            <p>NIM: 20240140111</p>
        </section>

        <section>
            <h2>Cari Lokasi</h2>
            <div class="form-cari">
                <input
                    type="text"
                    id="inputLokasi"
                    placeholder="Masukkan nama kota"
                >
                <button type="button" onclick="cariLokasi()">Cari</button>
            </div>
        </section>

        <section>
            <h2>Hasil Pencarian</h2>
            <div class="hasil">
                <div>
                    <h3>Lokasi</h3>
                    <p id="lokasi">-</p>
                </div>
                <div>
                    <h3>Negara</h3>
                    <p id="negara">-</p>
                </div>
                <div>
                    <h3>Provinsi</h3>
                    <p id="provinsi">-</p>
                </div>
                <div>
                    <h3>Kecamatan</h3>
                    <p id="kecamatan">-</p>
                </div>
                <div>
                    <h3>Longitude</h3>
                    <p id="longitude">-</p>
                </div>
                <div>
                    <h3>Latitude</h3>
                    <p id="latitude">-</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const input = document.getElementById("inputLokasi");

        // Tekan Enter untuk mencari
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") cariLokasi();
        });

        function cariLokasi() {
            const kota = input.value.trim();

            if (!kota) {
                alert("Silakan masukkan lokasi terlebih dahulu.");
                return;
            }

            fetch(`/api/lokasi?kota=${encodeURIComponent(kota)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert(data.message);
                        return;
                    }

                    const isi = (id, nilai) => {
                        document.getElementById(id).textContent = nilai ?? "-";
                    };

                    isi("lokasi", data.lokasi);
                    isi("negara", data.negara);
                    isi("provinsi", data.provinsi);
                    isi("kecamatan", data.kecamatan);
                    isi("longitude", data.longitude);
                    isi("latitude", data.latitude);
                })
                .catch(error => {
                    console.error(error);
                    alert("Terjadi kesalahan saat mengambil data.");
                });
        }
    </script>
</body>
</html>
